# SonarCloud configuration (read by automatic analysis).
#
# Scope: the shipped package (src/) and its tests.  The development
# measurement harness and one-off helpers are excluded from analysis on
# purpose:
#
# - experiments/  — measurement harness for the alpha-prep investigation.
#   Runs OCRmyPDF with a stub OCR engine against recorded line data; it
#   contains paths and environment assumptions specific to the machine the
#   measurements were made on, and none of it ships in the wheel.
# - scripts/      — operator-run benchmark helper (scripts/gpu_e2e.py).
#   Not part of the installed package; it invokes ocrmypdf with arguments
#   supplied by the operator on the operator's own machine.
# - drafts/       — unreviewed DRAFT release materials (see REPORT.md).
sonar.exclusions=experiments/**, scripts/**, drafts/**
