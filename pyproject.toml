[project]
name = "ocrmypdf-nuqta"
version = "0.1.0"
description = "OCRmyPDF engine plugin: Nuqta Arabic OCR with faithful tashkeel and line-level hOCR"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "AbdoSol1iman" }]
keywords = ["ocr", "arabic", "tashkeel", "ocrmypdf", "hocr", "pdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Arabic",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "ocrmypdf>=17.13,<18",
  "nuqta-ocr>=0.2.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "lxml>=5"]

[project.entry-points."ocrmypdf"]
nuqta = "ocrmypdf_nuqta"

[project.urls]
Repository = "https://github.com/AbdoSol1iman/ocrmypdf-nuqta"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocrmypdf_nuqta"]
