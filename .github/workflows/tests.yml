name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Nuqta's line-layout work lives on this branch until the upstream PR is
      # No nuqta-ocr release contains `read_lines` yet; pin to the PR #3 merge
      # commit on upstream main until a release supersedes it.  --only-binary
      # keeps pip from building random sdists for the transitive deps (the
      # explicitly given git URL itself is still built from source).
      - run: 'pip install --only-binary :all: "nuqta-ocr[layout] @ git+https://github.com/SalahAlHaismawi/nuqta-ocr.git@832f55a1703eb88a8e501d74709013c255db6b66"'
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
